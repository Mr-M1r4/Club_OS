name: Database migration validation
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/database-tests.yml']
permissions:
  contents: read
jobs:
  migration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository migration set
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/tests/database/001_core_integrity.test.sql
          test -f supabase/tests/database/002_security_membership_scope.test.sql
          test -f supabase/tests/database/003_product_image_tenant_isolation.test.sql
          grep -q "cm.active" supabase/migrations/20261106010648_enforce_active_membership_scope.sql
          grep -q "storage.foldername(name)" supabase/migrations/20261106010828_harden_product_image_tenant_paths_and_table_grants.sql
          grep -Rqi "enable row level security" supabase/migrations
          grep -Rqi "security definer" supabase/migrations
      - name: Validate migration numbering
        shell: bash
        run: |
          set -euo pipefail
          previous=0
          while IFS= read -r file; do
            version="${file##*/}"
            version="${version%%_*}"
            if ! [[ "$version" =~ ^[0-9]{14}$ ]]; then echo "Invalid migration filename: $file"; exit 1; fi
            if (( 10#$version <= previous )); then echo "Migration ordering error at $file"; exit 1; fi
            previous=10#$version
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
